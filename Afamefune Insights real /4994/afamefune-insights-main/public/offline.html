<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline — Afamefune Insights</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>
  :root {
    --bg: #0b0d12;
    --surface: #12151d;
    --border: #262b38;
    --text: #eceef2;
    --text-dim: #8d93a3;
    --accent: #e2a34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  img { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 20px; }
  h1 { font-size: 1.3rem; margin-bottom: 8px; color: var(--accent); }
  p { color: var(--text-dim); font-size: 0.9rem; max-width: 320px; line-height: 1.5; margin-bottom: 20px; }
  button {
    background: var(--accent); color: #17110a; border: none; padding: 12px 24px;
    border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  }
</style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="Afamefune Insights">
  <h1>You're offline</h1>
  <p>Afamefune Insights needs a connection to load your trades, prices, and account data. Static parts of the app are cached, but live data requires the network.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
